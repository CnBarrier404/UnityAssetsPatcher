name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOLUTION_PATH: UnityAssetsPatcher.sln
  PROJECT_PATH: src/UnityAssetsPatcher/UnityAssetsPatcher.csproj
  RUNTIME_IDENTIFIER: win-x64

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ github.ref_name }}

    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      executable_filename: ${{ steps.release.outputs.artifact_name }}.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show .NET environment
        run: dotnet --info

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $tag = "$env:TAG_NAME"

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$') {
            throw "Release tags must look like v1.2.3 or v1.2.3-beta.1. Actual tag: $tag"
          }

          $version = $Matches.version
          $artifactName = "UnityAssetsPatcher-$tag-${{ env.RUNTIME_IDENTIFIER }}"
          $isPrerelease = $version.Contains("-").ToString().ToLowerInvariant()

          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }} --runtime ${{ env.RUNTIME_IDENTIFIER }}

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Publish executable
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            --configuration Release `
            --runtime $env:RUNTIME_IDENTIFIER `
            --self-contained true `
            --no-restore `
            --output "artifacts/publish/$env:RUNTIME_IDENTIFIER" `
            -p:JsonSerializerIsReflectionEnabledByDefault=false `
            -p:WarningsAsErrors=IL2026%3BIL3050 `
            -p:PublishAot=true `
            -p:PublishSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.release.outputs.version }} `
            -p:InformationalVersion=${{ env.TAG_NAME }}

      - name: Stage release executable
        id: executable
        shell: pwsh
        run: |
          $sourcePath = "artifacts/publish/${{ env.RUNTIME_IDENTIFIER }}/UnityAssetsPatcher.exe"
          $executablePath = "artifacts/${{ steps.release.outputs.artifact_name }}.exe"

          if (-not (Test-Path -Path $sourcePath -PathType Leaf)) {
            throw "Published executable not found: $sourcePath"
          }

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -Path $sourcePath -Destination $executablePath
          "executable_path=$executablePath" >> $env:GITHUB_OUTPUT

      - name: Generate checksum
        id: checksum
        shell: pwsh
        run: |
          $executablePath = "${{ steps.executable.outputs.executable_path }}"
          $hash = (Get-FileHash -Path $executablePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumFile = "artifacts/SHA256"
          "$hash  $(Split-Path $executablePath -Leaf)" | Set-Content -Path $checksumFile -Encoding utf8
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumFile" >> $env:GITHUB_OUTPUT

      - name: Generate update manifest
        shell: pwsh
        run: |
          $tag = "$env:TAG_NAME"
          $executableFilename = "${{ steps.release.outputs.artifact_name }}.exe"
          $sha256 = "${{ steps.checksum.outputs.sha256 }}"
          $repositoryUrl = "https://github.com/${{ github.repository }}"
          $manifestPath = "artifacts/update.json"

          $manifest = [ordered]@{
            schemaVersion = 1
            version = $tag
            releaseUrl = "$repositoryUrl/releases/tag/$tag"
            downloadUrl = "$repositoryUrl/releases/download/$tag/$executableFilename"
            sha256 = $sha256
          }

          $manifest | ConvertTo-Json | Set-Content -Path $manifestPath -Encoding utf8

          $parsed = Get-Content -Raw -Path $manifestPath | ConvertFrom-Json

          if ($parsed.schemaVersion -ne 1 -or
              $parsed.version -ne $tag -or
              $parsed.downloadUrl -notlike "*/$executableFilename" -or
              $parsed.sha256 -ne $sha256 -or
              $parsed.sha256 -notmatch '^[0-9a-f]{64}$') {
            throw "Generated update manifest failed validation."
          }

      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "$env:TAG_NAME"
          $version = "${{ steps.release.outputs.version }}"
          $notesPath = "artifacts/release-notes.md"
          $fallbackNotes = "Automated release for $tag."

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          $changelogPath = @("docs/changelog.md", "docs/CHANGELOG.md") |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $changelogPath) {
            $fallbackNotes | Set-Content -Path $notesPath -Encoding utf8
            "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $lines = Get-Content -Path $changelogPath
          $headingPattern = '^\s*##\s+\[?(?<heading>v?\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)\]?(?:\s|$)'
          $nextHeadingPattern = '^\s*##\s+'
          $startIndex = $null

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $headingPattern) {
              $heading = $Matches.heading

              if ($heading -eq $tag -or $heading -eq $version) {
                $startIndex = $i
                break
              }
            }
          }

          if ($null -eq $startIndex) {
            $fallbackNotes | Set-Content -Path $notesPath -Encoding utf8
            "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $endIndex = $lines.Count

          for ($i = $startIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $nextHeadingPattern) {
              $endIndex = $i
              break
            }
          }

          $sectionLines = @()

          if ($endIndex -gt ($startIndex + 1)) {
            $sectionLines = $lines[($startIndex + 1)..($endIndex - 1)]
          }

          $releaseNotes = ($sectionLines -join [Environment]::NewLine).Trim()

          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            $releaseNotes = $fallbackNotes
          }

          $releaseNotes | Set-Content -Path $notesPath -Encoding utf8
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            artifacts/${{ steps.release.outputs.artifact_name }}.exe
            artifacts/SHA256
            artifacts/update.json
            artifacts/release-notes.md
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: artifacts/release-notes.md
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          files: |
            artifacts/${{ needs.build.outputs.executable_filename }}
            artifacts/SHA256
            artifacts/update.json
