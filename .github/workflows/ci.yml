name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: UnityAssetsPatcher.slnx
  PROJECT_PATH: src/UnityAssetsPatcher/UnityAssetsPatcher.csproj
  RUNTIME_IDENTIFIER: win-x64

jobs:
  validate:
    name: Build and test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }} --runtime ${{ env.RUNTIME_IDENTIFIER }}

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Verify publish
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            --configuration Release `
            --runtime $env:RUNTIME_IDENTIFIER `
            --self-contained true `
            --no-restore `
            --output artifacts/ci-publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false

      - name: Upload CI build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-${{ github.run_number }}
          path: artifacts/ci-publish
          if-no-files-found: error
